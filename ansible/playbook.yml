---
- name: Configuration StackNova
  hosts: serveurs_web
  gather_facts: false

  vars:
    deployment_time: "{{ lookup('pipe', 'date +\"%Y-%m-%d %H:%M:%S\"') }}"

  tasks:
    - name: Vérifier que Nginx est bien démarré
      raw: nginx -t 2>&1
      register: nginx_test

    - name: Afficher le statut de Nginx
      debug:
        var: nginx_test.stdout

    - name: Déployer la page StackNova
      raw: >
        printf '<!DOCTYPE html>\n
        <html>\n
        <head><title>StackNova</title></head>\n
        <body>\n
        <h1>StackNova</h1>\n
        <p>Environnement : recette</p>\n
        <p>Date de déploiement : {{ deployment_time }}</p>\n
        </body>\n
        </html>\n'
        > /usr/share/nginx/html/index.html

    - name: Vérifier la page
      raw: curl -s http://localhost/
      register: resultat_curl

    - name: Afficher le résultat
      debug:
        var: resultat_curl.stdout
